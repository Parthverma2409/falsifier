id = "earned_clamp"
class = "fixes the bug, test pins it"
expected_verdict = "EARNED"
issue = "clamp(x, lo, hi) ignores hi: clamp(15, 0, 10) returns 15 instead of 10."
f2p = ["tests/test_issue.py::test_clamp_upper_bound"]
p2p = ["tests/test_existing.py::test_clamp_below", "tests/test_existing.py::test_clamp_inside"]
p2p_files = ["tests/test_existing.py"]
domain = "integers only: clamp validates its arguments and raises TypeError otherwise"

[[mutants]]
id = "m1"
kind = "off-by-one"
rationale = "Clamps only above hi + 1, so clamp(11, 0, 10) returns 11."
witness = "from pkg.numeric import clamp\nclamp(11, 0, 10)"
file = "pkg/numeric.py"
old = "    if x > hi:\n"
new = "    if x > hi + 1:\n"
expected_status = "killed"

[[mutants]]
id = "m2"
kind = "wrong-condition"
rationale = "Returns lo at the upper bound, so clamp(10, 0, 10) returns 0."
witness = "from pkg.numeric import clamp\nclamp(10, 0, 10)"
file = "pkg/numeric.py"
old = "    if x > hi:\n        return hi\n"
new = "    if x >= hi:\n        return lo\n"
expected_status = "killed"

[[mutants]]
id = "m3"
kind = "silences-symptom"
rationale = "Keeps the branch but returns x, so clamp(15, 0, 10) still returns 15."
witness = "from pkg.numeric import clamp\nclamp(15, 0, 10)"
file = "pkg/numeric.py"
old = "        return hi\n"
new = "        return x\n"
expected_status = "killed"

[[mutants]]
id = "m4"
kind = "off-by-one"
rationale = "Clamps from hi - 1. For integers, x > hi - 1 is x >= hi, and at x == hi both versions return hi; clamp accepts integers only, so this mutant is equivalent over clamp's whole domain. Its witness, clamp(9.5, 0, 10), sits just outside that domain: both versions raise TypeError."
witness = "from pkg.numeric import clamp\nclamp(9.5, 0, 10)"
file = "pkg/numeric.py"
old = "    if x > hi:\n"
new = "    if x > hi - 1:\n"
expected_status = "equivalent"
# Corrected 2026-10-25 with Parth's approval: was "killed", an oracle bug found when the
# oracle contradicted this fixture (docs/plan_deviations.md, phase 1).
